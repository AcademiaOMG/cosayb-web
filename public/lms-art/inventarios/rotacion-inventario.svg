<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Rotación y días de inventario</title><desc id="d">Dos fórmulas: rotación igual a costo de ventas dividido por inventario promedio; días de inventario igual a 30 dividido por la rotación mensual.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Rotación y días de inventario</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">¿Cuántas veces se renueva el stock y cuántos días dura?</text><rect x="32" y="96" width="320" height="120" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="192" y="132.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Rotación (veces al mes)</text><text x="192" y="151.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">= Costo de ventas del mes</text><text x="192" y="170.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">÷ Inventario promedio</text><text x="192" y="189.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">$18.000.000 ÷ $4.500.000 = 4,0</text><rect x="368" y="96" width="320" height="120" rx="14" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="528" y="132.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Días de inventario</text><text x="528" y="151.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">= 30 días ÷ rotación</text><text x="528" y="170.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">30 ÷ 4,0 = 7,5 días</text><text x="528" y="189.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Meta típica en perecederos: pocos días</text><rect x="32" y="236" width="656" height="88" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="360" y="275.1666666666667" font-size="14" font-weight="600" fill="#7A4700" text-anchor="middle">Lectura: rotación baja = dinero parado, riesgo de vencimiento.</text><text x="360" y="294.1666666666667" font-size="14" font-weight="600" fill="#7A4700" text-anchor="middle">Rotación muy alta = riesgo de quiebres de stock y compras de urgencia (más caras).</text>
</svg>
