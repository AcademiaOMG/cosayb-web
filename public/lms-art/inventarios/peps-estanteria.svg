<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">PEPS en la estantería</title><desc id="d">Tres lotes de leche ordenados por fecha de ingreso y vencimiento; el más antiguo queda al frente y sale primero.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">PEPS: primero en entrar, primero en salir</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">El lote que llegó antes (y vence antes) queda al frente.</text><rect x="40" y="100" width="640" height="150" rx="12" fill="#EEF4FF" stroke="#1B4FD8" stroke-width="2"/><line x1="40" y1="175" x2="680" y2="175" stroke="#1B4FD8" stroke-width="3" /><rect x="70" y="112" width="170" height="56" rx="14" fill="#22B573" stroke="#22B573" stroke-width="1.5"/><text x="155" y="135.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lote A · Ingresó 02/11</text><text x="155" y="153.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vence 12/11</text><rect x="270" y="112" width="170" height="56" rx="14" fill="#3B8BF5" stroke="#3B8BF5" stroke-width="1.5"/><text x="355" y="135.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lote B · Ingresó 05/11</text><text x="355" y="153.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vence 15/11</text><rect x="470" y="112" width="170" height="56" rx="14" fill="#1B4FD8" stroke="#1B4FD8" stroke-width="1.5"/><text x="555" y="135.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Lote C · Ingresó 09/11</text><text x="555" y="153.33333333333334" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vence 19/11</text><text x="70" y="200" font-size="14" font-weight="800" fill="#0F6B43" text-anchor="start">FRENTE → sale primero</text><text x="610" y="200" font-size="14" font-weight="800" fill="#566176" text-anchor="end">FONDO</text><line x1="150" y1="225" x2="150" y2="260" stroke="#22B573" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="40" y="276" width="640" height="56" rx="14" fill="#D9F6E6" stroke="#22B573" stroke-width="1.5"/><text x="360" y="308.6666666666667" font-size="14" font-weight="700" fill="#0F6B43" text-anchor="middle">Regla práctica: etiqueta con fecha de ingreso y vencimiento; reponer SIEMPRE por detrás.</text>
</svg>
