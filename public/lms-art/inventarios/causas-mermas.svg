<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Causas de las mermas en una cocina</title><desc id="d">Gráfico de barras horizontales con las causas típicas de pérdida: vencimiento, sobreproducción, errores de preparación, porcionado, devoluciones, robo y errores de registro.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">¿Dónde se pierde el dinero?</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Distribución ilustrativa de pérdidas medidas en una cocina de 12 mesas (datos de ejemplo).</text><text x="32" y="112" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Productos vencidos</text><rect x="230" y="96" width="420" height="20" rx="6" fill="#1B4FD8"/><text x="656" y="112" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">28 %</text><text x="32" y="146" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Sobreproducción</text><rect x="230" y="130" width="330" height="20" rx="6" fill="#3B8BF5"/><text x="566" y="146" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">22 %</text><text x="32" y="180" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Errores de preparación</text><rect x="230" y="164" width="240" height="20" rx="6" fill="#3B8BF5"/><text x="476" y="180" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">16 %</text><text x="32" y="214" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Porcionado sin control</text><rect x="230" y="198" width="210" height="20" rx="6" fill="#3B8BF5"/><text x="446" y="214" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">14 %</text><text x="32" y="248" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Devoluciones y reclamos</text><rect x="230" y="232" width="135" height="20" rx="6" fill="#C9D6EE"/><text x="371" y="248" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">9 %</text><text x="32" y="282" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Faltantes sin explicar</text><rect x="230" y="266" width="105" height="20" rx="6" fill="#C9D6EE"/><text x="341" y="282" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">7 %</text><text x="32" y="316" font-size="13" font-weight="700" fill="#12213A" text-anchor="start">Errores de registro</text><rect x="230" y="300" width="60" height="20" rx="6" fill="#C9D6EE"/><text x="296" y="316" font-size="13" font-weight="800" fill="#1434A4" text-anchor="start">4 %</text><text x="32" y="346" font-size="13" font-weight="700" fill="#566176" text-anchor="start">Lo que no se mide no se gestiona: registra cada merma con causa, cantidad y valor.</text>
</svg>
