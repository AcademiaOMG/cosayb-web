<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Flujo de los insumos en la cocina</title><desc id="d">Recepción, almacenamiento, requisición, producción y servicio, con los controles de cada etapa: verificar contra orden de compra, rotar PEPS, firmar vales de salida y registrar mermas.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Flujo de los insumos en la cocina</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Cada traspaso tiene un responsable y un registro.</text><rect x="20" y="100" width="124" height="96" rx="14" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="82" y="134.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Recepción</text><text x="82" y="152.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Pesar, verificar</text><text x="82" y="170.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">temperatura y fecha</text><line x1="146" y1="148" x2="158" y2="148" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="160" y="100" width="124" height="96" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="222" y="134.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Almacenamiento</text><text x="222" y="152.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Ubicar y rotar</text><text x="222" y="170.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">(PEPS)</text><line x1="286" y1="148" x2="298" y2="148" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="100" width="124" height="96" rx="14" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="362" y="134.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Requisición</text><text x="362" y="152.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Vale de salida</text><text x="362" y="170.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">firmado</text><line x1="426" y1="148" x2="438" y2="148" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="440" y="100" width="124" height="96" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="502" y="134.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Producción</text><text x="502" y="152.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Receta estándar</text><text x="502" y="170.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">y porcionado</text><line x1="566" y1="148" x2="578" y2="148" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="580" y="100" width="124" height="96" rx="14" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="642" y="134.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Servicio</text><text x="642" y="152.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">Venta y</text><text x="642" y="170.33333333333334" font-size="13" font-weight="700" fill="#12213A" text-anchor="middle">registro</text><rect x="32" y="228" width="656" height="96" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="360" y="262.3333333333333" font-size="13" font-weight="600" fill="#7A4700" text-anchor="middle">Controles clave</text><text x="360" y="280.3333333333333" font-size="13" font-weight="600" fill="#7A4700" text-anchor="middle">Recepción: factura vs. orden de compra · Almacén: fecha y etiqueta · Cocina: vale de salida · Cierre: conteo físico</text><text x="360" y="298.3333333333333" font-size="13" font-weight="600" fill="#7A4700" text-anchor="middle">Todo faltante se explica con un registro: venta, merma, devolución o consumo de personal</text>
</svg>
