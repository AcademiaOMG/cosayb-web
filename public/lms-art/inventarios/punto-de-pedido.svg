<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Punto de pedido y stock de seguridad</title><desc id="d">Gráfica en dientes de sierra: el inventario baja con el consumo; al llegar al punto de pedido se ordena y el pedido llega después del plazo de entrega, sin tocar el stock de seguridad.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Punto de pedido</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Se ordena cuando el saldo toca el punto de pedido, no cuando se acaba.</text><line x1="60" y1="90" x2="60" y2="300" stroke="#12213A" stroke-width="2" /><line x1="60" y1="300" x2="680" y2="300" stroke="#12213A" stroke-width="2" /><polyline points="60,110 250,230 250,110 440,230 440,110 630,230" fill="none" stroke="#1B4FD8" stroke-width="3.5"/><line x1="60" y1="230" x2="680" y2="230" stroke="#F59E0B" stroke-width="2" stroke-dasharray="8 6"/><line x1="60" y1="270" x2="680" y2="270" stroke="#F0527E" stroke-width="2" stroke-dasharray="8 6"/><text x="684" y="234" font-size="12" font-weight="800" fill="#7A4700" text-anchor="start">Punto de pedido</text><text x="684" y="274" font-size="12" font-weight="800" fill="#A31D46" text-anchor="start">Stock de seguridad</text><text x="66" y="106" font-size="12" font-weight="700" fill="#566176" text-anchor="start">Máximo</text><text x="200" y="324" font-size="12" font-weight="700" fill="#566176" text-anchor="start">plazo de entrega</text><text x="520" y="324" font-size="12" font-weight="700" fill="#566176" text-anchor="start">tiempo →</text><rect x="32" y="330" width="656" height="24" rx="8" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="346" font-size="12" font-weight="700" fill="#12213A" text-anchor="middle">PP = consumo diario × plazo de entrega + stock de seguridad</text>
</svg>
