<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">De costo por porción a precio de venta</title><desc id="d">Cálculo en tres pasos: precio sin impuesto igual al costo dividido entre el food cost objetivo, luego se suma el impuesto al consumo del 8 por ciento y se redondea.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">De costo por porción a precio de venta</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Ejemplo: costo de ingredientes por porción $6.200 con food cost objetivo 31 %.</text><rect x="32" y="100" width="200" height="110" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="132" y="130" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">Paso 1</text><text x="132" y="150" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">Precio sin impuesto</text><text x="132" y="170" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">= $6.200 ÷ 0,31</text><text x="132" y="190" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">= $20.000</text><line x1="236" y1="155" x2="262" y2="155" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="266" y="100" width="200" height="110" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="366" y="130" font-size="15" font-weight="700" fill="#7A4700" text-anchor="middle">Paso 2</text><text x="366" y="150" font-size="15" font-weight="700" fill="#7A4700" text-anchor="middle">Impoconsumo 8 %</text><text x="366" y="170" font-size="15" font-weight="700" fill="#7A4700" text-anchor="middle">= $20.000 × 0,08</text><text x="366" y="190" font-size="15" font-weight="700" fill="#7A4700" text-anchor="middle">= $1.600</text><line x1="470" y1="155" x2="496" y2="155" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="500" y="100" width="188" height="110" rx="14" fill="#1B4FD8" stroke="#C9D6EE" stroke-width="1.5"/><text x="594" y="130" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Paso 3</text><text x="594" y="150" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Precio en carta</text><text x="594" y="170" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">= $21.600</text><text x="594" y="190" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">→ redondea a $21.500</text><rect x="32" y="240" width="656" height="82" rx="14" fill="#FFFFFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="276.1666666666667" font-size="14" font-weight="600" fill="#12213A" text-anchor="middle">Comprobación: $21.500 ÷ 1,08 = $19.907 sin impuesto → food cost real = 6.200 ÷ 19.907 = 31,1 %</text><text x="360" y="295.1666666666667" font-size="14" font-weight="600" fill="#12213A" text-anchor="middle">La propina voluntaria no hace parte de la base del impuesto (concepto DIAN).</text>
</svg>
