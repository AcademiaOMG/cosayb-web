<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Anatomía de una ficha de receta estándar</title><desc id="d">Una ficha con encabezado, tabla de ingredientes con cantidad neta, merma y costo, método de preparación, rendimiento y costo por porción.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Anatomía de una ficha de receta estándar</text><rect x="32" y="84" width="656" height="250" rx="12" fill="#FFFFFF" stroke="#1B4FD8" stroke-width="2"/><rect x="44" y="96" width="632" height="34" rx="8" fill="#1B4FD8" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="117.33333333333333" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ENCABEZADO · nombre, código, categoría, versión, fecha, responsable</text><rect x="44" y="138" width="400" height="112" rx="8" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="244" y="180.33333333333334" font-size="13" font-weight="600" fill="#12213A" text-anchor="middle">TABLA DE INGREDIENTES</text><text x="244" y="198.33333333333334" font-size="13" font-weight="600" fill="#12213A" text-anchor="middle">ingrediente · cantidad neta · unidad · % merma</text><text x="244" y="216.33333333333334" font-size="13" font-weight="600" fill="#12213A" text-anchor="middle">cantidad bruta · costo unitario · costo total</text><rect x="454" y="138" width="222" height="112" rx="8" fill="#D9F6E6" stroke="#22B573" stroke-width="1.5"/><text x="565" y="180.33333333333334" font-size="13" font-weight="600" fill="#0F6B43" text-anchor="middle">RENDIMIENTO</text><text x="565" y="198.33333333333334" font-size="13" font-weight="600" fill="#0F6B43" text-anchor="middle">total de la receta</text><text x="565" y="216.33333333333334" font-size="13" font-weight="600" fill="#0F6B43" text-anchor="middle">número y peso de porciones</text><rect x="44" y="258" width="400" height="64" rx="8" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="244" y="285.3333333333333" font-size="13" font-weight="600" fill="#12213A" text-anchor="middle">MÉTODO · pasos, tiempos, temperaturas, equipo</text><text x="244" y="303.3333333333333" font-size="13" font-weight="600" fill="#12213A" text-anchor="middle">puntos de control de calidad e inocuidad</text><rect x="454" y="258" width="222" height="64" rx="8" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="565" y="285.3333333333333" font-size="13" font-weight="700" fill="#7A4700" text-anchor="middle">COSTO POR PORCIÓN</text><text x="565" y="303.3333333333333" font-size="13" font-weight="700" fill="#7A4700" text-anchor="middle">y food cost del plato</text>
</svg>
