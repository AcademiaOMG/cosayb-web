<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Peso bruto, merma y peso neto</title><desc id="d">Una barra de 1.000 g de peso bruto se divide en 780 g de peso neto aprovechable y 220 g de merma. El factor de rendimiento es 0,78.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Peso bruto, merma y peso neto</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Ejemplo: 1.000 g de pechuga con hueso y piel.</text><rect x="60" y="110" width="600" height="54" rx="8" fill="#C9D6EE" stroke="#C9D6EE" stroke-width="1.5"/><rect x="60" y="110" width="468" height="54" rx="8" fill="#1B4FD8"/><rect x="528" y="110" width="132" height="54" rx="8" fill="#F0527E"/><text x="294" y="144" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Peso neto 780 g (aprovechable)</text><text x="594" y="144" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Merma 220 g</text><text x="60" y="100" font-size="14" font-weight="700" fill="#566176" text-anchor="start">Peso bruto (PB) = 1.000 g</text><rect x="60" y="196" width="290" height="74" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="205" y="228" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">Factor de rendimiento (FR)</text><text x="205" y="248" font-size="15" font-weight="700" fill="#12213A" text-anchor="middle">FR = PN ÷ PB = 780 ÷ 1.000 = 0,78</text><rect x="370" y="196" width="290" height="74" rx="14" fill="#FFE2EA" stroke="#F0527E" stroke-width="1.5"/><text x="515" y="228" font-size="15" font-weight="700" fill="#A31D46" text-anchor="middle">% de merma</text><text x="515" y="248" font-size="15" font-weight="700" fill="#A31D46" text-anchor="middle">= 1 − FR = 22 %</text><rect x="60" y="286" width="600" height="46" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="360" y="313.6666666666667" font-size="14" font-weight="700" fill="#7A4700" text-anchor="middle">Costo por kg neto = costo por kg bruto ÷ FR   (si el bruto cuesta $12.000/kg → $15.385/kg neto)</text>
</svg>
