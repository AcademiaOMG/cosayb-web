<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Del pollo entero al aprovechable</title><desc id="d">Cascada: 1.800 g de pollo entero, menos hueso y piel 612 g, menos grasa y recortes 90 g, igual 1.098 g de carne aprovechable, rendimiento 61 por ciento.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Prueba de rendimiento: pollo entero</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Se pesa en cada etapa; el factor de rendimiento sale de datos propios, no de tablas ajenas.</text><rect x="50" y="100" width="120" height="190" rx="8" fill="#1B4FD8"/><text x="110" y="92" font-size="15" font-weight="800" fill="#12213A" text-anchor="middle">1.800 g</text><text x="110" y="312" font-size="13" font-weight="700" fill="#566176" text-anchor="middle">Pollo entero</text><rect x="215" y="100" width="120" height="64.60000000000001" rx="8" fill="#F0527E"/><text x="275" y="92" font-size="15" font-weight="800" fill="#12213A" text-anchor="middle">−612 g</text><text x="275" y="312" font-size="13" font-weight="700" fill="#566176" text-anchor="middle">Hueso y piel</text><rect x="380" y="164.60000000000002" width="120" height="9.5" rx="8" fill="#F59E0B"/><text x="440" y="156.60000000000002" font-size="15" font-weight="800" fill="#12213A" text-anchor="middle">−90 g</text><text x="440" y="312" font-size="13" font-weight="700" fill="#566176" text-anchor="middle">Grasa y recortes</text><rect x="545" y="174.10000000000002" width="120" height="115.89999999999999" rx="8" fill="#22B573"/><text x="605" y="166.10000000000002" font-size="15" font-weight="800" fill="#12213A" text-anchor="middle">1.098 g</text><text x="605" y="312" font-size="13" font-weight="700" fill="#566176" text-anchor="middle">Carne aprovechable</text><text x="32" y="340" font-size="15" font-weight="800" fill="#1434A4" text-anchor="start">FR = 1.098 ÷ 1.800 = 0,61  →  merma 39 %</text>
</svg>
