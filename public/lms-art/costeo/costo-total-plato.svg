<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Qué compone el costo de un plato</title><desc id="d">Barra apilada: materia prima 62 %, mano de obra directa 25 %, costos indirectos 13 %.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Qué compone el costo de un plato</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Ejemplo ilustrativo de un plato con costo total de $10.000.</text><rect x="60" y="100" width="403" height="64" fill="#1B4FD8"/><rect x="463" y="100" width="162" height="64" fill="#3B8BF5"/><rect x="625" y="100" width="35" height="64" fill="#F59E0B"/><text x="262" y="138" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Materia prima  $6.200</text><text x="544" y="138" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">Mano de obra $2.500</text><rect x="60" y="190" width="190" height="78" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="155" y="214.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Materia prima (MP)</text><text x="155" y="233.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Ingredientes con merma</text><text x="155" y="252.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">62 %</text><rect x="265" y="190" width="190" height="78" rx="14" fill="#DCECFF" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="214.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Mano de obra directa</text><text x="360" y="233.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Tiempo de preparación</text><text x="360" y="252.66666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">25 %</text><rect x="470" y="190" width="190" height="78" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="565" y="214.66666666666666" font-size="14" font-weight="700" fill="#7A4700" text-anchor="middle">Costos indirectos</text><text x="565" y="233.66666666666666" font-size="14" font-weight="700" fill="#7A4700" text-anchor="middle">Gas, energía, empaque…</text><text x="565" y="252.66666666666666" font-size="14" font-weight="700" fill="#7A4700" text-anchor="middle">13 %  ($1.300)</text><rect x="60" y="286" width="600" height="44" rx="14" fill="#1B4FD8" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="313" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Costo total = MP + MOD + CIF = $6.200 + $2.500 + $1.300 = $10.000</text>
</svg>
