<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
<title id="t">Del ingrediente al precio de venta</title><desc id="d">Cinco pasos encadenados: ingredientes con su costo, rendimiento real, costo de la receta, costo por porción y precio de venta.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B4FD8"/></marker></defs>
<rect width="720" height="360" rx="18" fill="#FFFFFF"/>
<text x="32" y="44" font-size="22" font-weight="800" fill="#1434A4" text-anchor="start">Del ingrediente al precio de venta</text><text x="32" y="68" font-size="14" font-weight="500" fill="#566176" text-anchor="start">Cada paso alimenta al siguiente: un error al inicio se arrastra hasta el precio.</text><rect x="24" y="120" width="120" height="120" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="84" y="175.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Ingredientes</text><text x="84" y="194.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">y su costo de compra</text><circle cx="84" cy="120" r="16" fill="#1B4FD8"/><text x="84" y="126" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><line x1="146" y1="180" x2="160" y2="180" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="162" y="120" width="120" height="120" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="222" y="175.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Rendimiento</text><text x="222" y="194.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">merma y factor</text><circle cx="222" cy="120" r="16" fill="#1B4FD8"/><text x="222" y="126" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><line x1="284" y1="180" x2="298" y2="180" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="300" y="120" width="120" height="120" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="360" y="175.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Costo de la</text><text x="360" y="194.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">receta completa</text><circle cx="360" cy="120" r="16" fill="#1B4FD8"/><text x="360" y="126" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><line x1="422" y1="180" x2="436" y2="180" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="438" y="120" width="120" height="120" rx="14" fill="#EEF4FF" stroke="#C9D6EE" stroke-width="1.5"/><text x="498" y="175.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">Costo por</text><text x="498" y="194.16666666666666" font-size="14" font-weight="700" fill="#12213A" text-anchor="middle">porción</text><circle cx="498" cy="120" r="16" fill="#1B4FD8"/><text x="498" y="126" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><line x1="560" y1="180" x2="574" y2="180" stroke="#1B4FD8" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><rect x="576" y="120" width="120" height="120" rx="14" fill="#1B4FD8" stroke="#C9D6EE" stroke-width="1.5"/><text x="636" y="175.16666666666666" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Precio de</text><text x="636" y="194.16666666666666" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">venta</text><circle cx="636" cy="120" r="16" fill="#1434A4"/><text x="636" y="126" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">5</text><rect x="24" y="270" width="672" height="56" rx="14" fill="#FFF1D4" stroke="#F59E0B" stroke-width="1.5"/><text x="360" y="303" font-size="15" font-weight="700" fill="#7A4700" text-anchor="middle">Fórmula guía:  precio sin impuestos = costo por porción ÷ food cost objetivo</text>
</svg>
