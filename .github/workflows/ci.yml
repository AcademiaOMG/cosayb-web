name: CI

on:
  push:
    branches: [main, "integracion/**", "feat/**", "fix/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, tsc, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos (tsc)
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests unitarios
        run: pnpm test

      - name: Build de producción
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          NEXT_PUBLIC_FRONTEND_URL: https://cosayb.co
          NEXT_PUBLIC_SAAS_MODE: mock
